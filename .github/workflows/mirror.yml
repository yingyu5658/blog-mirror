name: Mirror from GlowIsle

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add GitHub to known hosts
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      
      - name: Clone from GlowIsle
        run: |
          git clone --mirror https://git.verdant.ee/blog.git temp-repo
          
      - name: Push to GitHub via SSH
        run: |
          cd temp-repo
          git remote set-url origin git@github.com:yingyu5658/blog-mirror.git
          git push --mirror
